<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <title>Weather maps</title>

    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="leaflet.css"/>
    <script src="leaflet.js"></script>
    <style type="text/css">
        body {
        }
        #timestamp {
          margin: 1em;
        }
        #map {
          position: absolute;
          top: 0;
          left: 0; bottom: 0; right: 0;
        }
        .back_button {
          float:left;
          background-color: #555;
          color: #fff;
          border: 1px solid #222;
          border-radius: 5px;
          padding: 5px;
          margin: 0;
          cursor: pointer;
        }
    </style>
  </head>
  <body>

    <div id="map"></div>
    <script>
      'use strict';

      var vars = {};
      var parts = window.location.href.replace(/[?&]+([^=&]+)=([^&]*)/gi, function(m,key,value) {
            vars[key] = value;
      });
      const  lat  = 50.15 //vars;
      const  lon  = -5.07 //vars;
      //const { appid } = vars;
      const appid = 'ceeff4f655122f1cc6258310c2772973';

      const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        { id: 'osm',
          attribution: 'Map data &copy;  <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' });
      const google =  L.tileLayer('https://mt0.google.com/vt/lyrs=y&hl=en&x={x}&s=&y={y}&z={z}',
        { id: 'streets', maxZoom: 21 });
      const owmRain = L.tileLayer(`https://tile.openweathermap.org/map/rain_cls/{z}/{x}/{y}.png?appid=${appid}`,
        {id: 'owmRain',
          attribution: 'Weather data &copy; <a href="https://openweathermap.org">OWM</a>', opacity: 0.4 });
      const owmPrec = L.tileLayer(`https://tile.openweathermap.org/map/precipitation/{z}/{x}/{y}.png?appid=${appid}`,
        {id: 'owmPrec',
          attribution: 'Weather data &copy; <a href="https://openweathermap.org">OWM</a>' });
      const owmClouds = L.tileLayer(`https://tile.openweathermap.org/map/clouds/{z}/{x}/{y}.png?appid=${appid}`,
        {id: 'owmCouds',
          attribution: 'Weather data &copy; <a href="https://openweathermap.org">OWM</a>' });
      const owmPres = L.tileLayer(`https://tile.openweathermap.org/map/pressure_cntr/{z}/{x}/{y}.png?appid=${appid}`,
        {id: 'owmPres',
          attribution: 'Weather data &copy; <a href="https://openweathermap.org">OWM</a>' });

      const baseMaps = {
        Openstreetmap: osm,
        Google: google
      };

      const overLayers = {
        Rainfall: owmRain,
        Precipitation: owmPrec,
        Clouds: owmClouds,
        Isobars: owmPres
      };

      const map = new L.Map('map', {
        center: [lat, lon], 
        zoom: 5, 
        layers: [ osm, owmRain ]
      }); 
      const mark = new L.CircleMarker([lat, lon]).addTo(map);

      // Layer control
      L.control.layers(baseMaps, overLayers).addTo(map);

      // Set cursors
      function onMouse(e) {
        e.type === 'mousedown' ? mapDiv.style.cursor = 'grab' :  mapDiv.style.cursor = 'default';
      }

      const mapDiv = document.getElementById('map');

      mapDiv.style.cursor = 'default';

      mapDiv.addEventListener('mousedown', onMouse);
      mapDiv.addEventListener('mouseup', onMouse);

      // onRemove(map) {
      //   // Nothing to do here
      // }
    </script>
  </body>
</html>
